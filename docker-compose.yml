# project name
name: aoyagi-diary-docker-compose

# このファイル定義しているコンテナー
services:
  aoyagi-diary-db:
    image: mysql:latest
    container_name: aoyagi-diary-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_DATABASE: "diary_mysql_db"
    ports:
      - "5555:3306"
    volumes:
      - db_data:/var/lib/mysql

  aoyagi-diary-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: aoyagi-diary-php
    ports:
      - "7777:80"
    volumes:
      - ./html:/var/www/html
    depends_on:
      - aoyagi-diary-db

volumes:
  db_data:
